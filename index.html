<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arab harflarini yozish mashqi</title>
<meta name="description" content="Arab harflarini telefonda barmoq bilan yozib mashq qiling: qolip, yozib ko'rsatish va tekshirish.">
<meta property="og:title" content="Arab harflarini yozish mashqi"><meta property="og:description" content="Barmoq bilan yozing, dastur tekshiradi.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%8D%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{--bg:#121816;--card:#1b2420;--ink:#eef3f0;--mute:#9aaba5;--line:#33433c;--acc:#2dd4bf;--accbg:#173a35;--hl:#fb923c;--onacc:#06201c;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}

.board{position:relative;flex:1;min-height:0;background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.board canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#d{touch-action:none;cursor:crosshair}
#f{pointer-events:none;opacity:.6}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 22px;font-size:20px;font-weight:800;opacity:0;pointer-events:none;transition:.18s;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.18);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast.ok{color:var(--ok);border-color:var(--ok)}.toast.bad{color:var(--bad);border-color:var(--bad)}
.bar{display:flex;gap:8px}
.btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;padding:13px 14px;font:inherit;font-size:15px;font-weight:800;cursor:pointer}
.btn.main{flex:1;background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.on{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:scale(.97)}
.pick{font:inherit;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;padding:4px 14px;font-weight:800;font-size:16px;display:flex;gap:8px;align-items:center;cursor:pointer}
.pa{font-family:"Noto Naskh Arabic",serif;font-size:26px;line-height:1.3}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.on{display:flex}
.sheetin{background:var(--bg);width:100%;max-width:560px;max-height:70%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.sh{font-weight:800;margin:0 2px 10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gi{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:6px 2px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.gi b{font-family:"Noto Naskh Arabic",serif;font-size:30px;line-height:1.3;font-weight:700}
.gi span{font-size:12px;font-weight:800;color:var(--mute)}
.gi.on{border-color:var(--acc);background:var(--accbg)}
</style>
</head>
<body>
<div class="app">
  <div class="top"><button class="pick" id="pick"><span class="pa" id="pa"></span><span id="pn"></span><span>▾</span></button><span class="chip" id="cnt">Takror: 0</span></div>
  <div class="tabs" id="tabs"></div>
  <div class="info"><div class="big" id="big"></div><div><h2 id="ttl"></h2><p id="tip"></p></div></div>
  <div class="board" id="board"><canvas id="g"></canvas><canvas id="f"></canvas><canvas id="d"></canvas><div class="toast" id="toast"></div></div>
  <div class="bar">
    <button class="btn" id="clr">Tozalash</button>
    <button class="btn" id="help">▶ Yordam</button>
    <button class="btn main" id="chk">Tekshirish</button>
  </div>
</div>
<div class="sheet" id="sheet"><div class="sheetin"><div class="sh">Harfni tanlang</div><div class="grid" id="grid"></div></div></div>
<script>document.write('<script src="letters.js?v='+Date.now()+'"><\/script>')</script>

 var id=++demoId,tl=[],t=0,prev=null,spd=.2,st=0,nn=0;
 src.forEach(function(s){if(prev){var d=Math.hypot(s.pts[0][0]-prev[0],s.pts[0][1]-prev[1]);tl.push({pts:[prev,s.pts[0]],cum:[0,d||1],draw:0,t0:t,t1:t+=260})}
  var L=s.cum[s.cum.length-1],du=s.pts.length==1?260:Math.max(800,L/spd);s.t0=t;s.t1=t+=du;s.draw=1;s.n=++nn;tl.push(s);prev=s.pts[s.pts.length-1]});
 var T=t;
 function line(p){fc.beginPath();if(p.length==1){fc.arc(p[0][0],p[0][1],fw/2,0,7);fc.fill();return}p.forEach(function(q,i){i?fc.lineTo(q[0],q[1]):fc.moveTo(q[0],q[1])});fc.stroke()}
 function step(now){if(id!==demoId)return;if(!st)st=now;var e=now-st,pen=null,i,s,p;fc.clearRect(0,0,W,H);dc.clearRect(0,0,W,H);
  if(e<T){fc.save();fc.lineCap='round';fc.lineJoin='round';fc.lineWidth=fw;fc.strokeStyle=fc.fillStyle=css('--acc');
   for(i=0;i<tl.length;i++){s=tl[i];if(e>=s.t1){if(s.draw)line(s.pts);pen=s.pts[s.pts.length-1]}else{if(e>=s.t0){p=part(s,(e-s.t0)/(s.t1-s.t0));if(s.draw)line(p);pen=p[p.length-1]}break}}
   fc.globalCompositeOperation='destination-in';glyph(fc,0);fc.restore();
   tl.forEach(function(s){if(s.draw&&e>=s.t0){var a=s.pts[0],bx=a[0]+15,by=a[1]-15;dc.beginPath();dc.arc(bx,by,11,0,7);dc.fillStyle=css('--ink');dc.fill();dc.fillStyle=css('--card');dc.font='800 13px Nunito,sans-serif';dc.textAlign='center';dc.textBaseline='middle';dc.fillText(s.n,bx,by+1)}});
   if(pen){dc.beginPath();dc.arc(pen[0],pen[1],PEN*1.1,0,7);dc.fillStyle='#ef4444';dc.fill();dc.lineWidth=3;dc.strokeStyle='#fff';dc.stroke()}
   requestAnimationFrame(step)}
  else{fc.save();glyph(fc,0);fc.globalCompositeOperation='source-in';fc.fillStyle=css('--acc');fc.fillRect(0,0,W,H);fc.restore();
   setTimeout(function(){if(id!==demoId)return;fc.clearRect(0,0,W,H);show('Endi yozing \u270d\ufe0f','ok',1400,false)},900)}}
 requestAnimationFrame(step)}
document.getElementById('clr').onclick=function(){if(!busy)clearAll()};
document.getElementById('help').onclick=demo;
document.getElementById('chk').onclick=check;
function mask(fn,S){S=S||.4;var c=document.createElement('canvas');c.width=Math.ceil(W*S);c.height=Math.ceil(H*S);var x=c.getContext('2d');x.scale(S,S);fn(x);return x.getImageData(0,0,c.width,c.height).data}
function glyph(x,tol){x.font='700 '+fs+'px '+FONT;x.direction='ltr';x.textAlign='left';x.textBaseline='alphabetic';x.fillStyle='#000';x.fillText(modes[cur].txt,gx0,gy);
 if(tol){x.strokeStyle='#000';x.lineWidth=tol;x.lineJoin='round';x.strokeText(modes[cur].txt,gx0,gy)}}
function glyphC(x,c){x.font='700 '+fs+'px '+FONT;x.direction='ltr';x.textAlign='left';x.textBaseline='alphabetic';x.fillStyle=c;x.fillText(modes[cur].txt,gx0,gy)}
function ink(x,w){x.strokeStyle='#000';x.fillStyle='#000';x.lineCap='round';x.lineJoin='round';x.lineWidth=w;strokes.forEach(function(s){x.beginPath();x.arc(s.p[0].x,s.p[0].y,w/2,0,7);x.fill();x.beginPath();s.p.forEach(function(p,i){i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y)});x.stroke()})}
function check(){if(busy)return;if(!strokes.length){show('Avval yozing ✍️','bad',1100,false);return}
 var tol=fw;
 var G=mask(function(x){glyph(x,0)}),Gd=mask(function(x){glyph(x,tol)}),Ut=mask(function(x){ink(x,tol)}),Tn=mask(function(x){ink(x,PEN)});
 var gN=0,gHit=0,tN=0,tIn=0;for(var i=3;i<G.length;i+=4){if(G[i]>40){gN++;if(Ut[i]>40)gHit++}if(Tn[i]>40){tN++;if(Gd[i]>40)tIn++}}
 var cov=gN?gHit/gN:0,prec=tN?tIn/tN:0,sc=Math.round((cov*.6+prec*.4)*100),mw=Math.ceil(W*.4),miss=0;
 paths.forEach(function(p){var hit=0;p.pts.forEach(function(q){if(Ut[(Math.floor(q[1]*.4)*mw+Math.floor(q[0]*.4))*4+3]>40)hit++});if(hit<p.pts.length*.5)miss++});
 var ok=cov>=.75&&prec>=.7&&!miss;
 if(ok){cnt[cur]++;save();chip();show('\u2713 Ajoyib! '+sc+'%','ok',1300,true)}
 else{fillLive();fc.save();fc.globalCompositeOperation='destination-over';glyphC(fc,'#ef4444');fc.restore();
  show(miss?'Yozilmagan qism bor (qizil)':prec<.7?'Chiziqdan chiqib ketdi':'Qizil joylarni ham yozing','bad',2800,true)}}
function show(msg,cls,ms,clear){toast.textContent=msg;toast.className='toast show '+cls;busy=!!clear;
 setTimeout(function(){toast.className='toast';if(clear){clearAll();busy=false}},ms)}
new ResizeObserver(function(){layout()}).observe(board);
window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',function(){drawGuide();redraw()});
setLetter(location.hash.slice(1));
if(document.fonts){document.fonts.load('700 80px "Noto Naskh Arabic"','ا').then(layout).catch(function(){})}
